name: OA20 read-only runner identity diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Observe actual Java identity without installing or changing tools
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          executable = shutil.which('java')
          assert executable is not None
          selected = pathlib.Path(executable).resolve()
          result = subprocess.run(['java', '-version'], capture_output=True, text=True, check=False)
          observed = result.stdout + result.stderr
          print(json.dumps({
              'purpose': 'read-only setup diagnostic; never certification',
              'java_path': executable,
              'java_realpath': str(selected),
              'java_sha256': hashlib.sha256(selected.read_bytes()).hexdigest(),
              'java_exit': result.returncode,
              'java_identity': observed,
              'configured_pin': '17.0.20',
              'configured_pin_matches': '"17.0.20"' in observed,
              'selected_public_java_paths': {name: os.environ.get(name)
                  for name in ('JAVA_HOME', 'JAVA_HOME_17_X64')},
          }, indent=2))
          assert result.returncode == 0
          PY
      - uses: actions/checkout@v7
        with:
          ref: 6c214d7365ee3b8378d38ebb8c9f355c7f311c17
          persist-credentials: false
      - name: Exercise corrected exact Java and NDK setup on the actual hosted runner
        env:
          BOOTSTRAP_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          OA18_PLATFORM_JSON: '{"android_ndk_version":"27.3.13750724","java_version":"17.0.20.1"}'
        run: python3 .github/scripts/prepare-hosted-assurance-platform.py --profile android
