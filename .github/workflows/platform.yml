name: OA20 native Windows source identity diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  RUSTUP_AUTO_INSTALL: '0'
  RUSTUP_TOOLCHAIN: '1.99.1'
  PROBE_CANDIDATE: d50eec3028ee673f02f19cd5b9282db725fcdc02
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: core.symlinks
  GIT_CONFIG_VALUE_1: 'true'
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d50eec3028ee673f02f19cd5b9282db725fcdc02
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: assurance-windows
          save-if: false
      - name: Prefetch both actual locked Windows dependency graphs
        run: |
          cargo +1.99.1 fetch --locked --manifest-path Cargo.toml
          cargo +1.99.1 fetch --locked --manifest-path bindings/tauri-desktop/src-tauri/Cargo.toml
      - name: Inspect native Windows link representation and canonical identity
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, platform, subprocess, sys
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root / '.github/scripts'))
          spec = importlib.util.spec_from_file_location('boundary', root / '.github/scripts/operational-assurance.py')
          boundary = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(boundary)
          assert platform.system() == 'Windows'
          boundary.clean(os.environ['PROBE_CANDIDATE'])
          canonical = boundary.sources()
          links = []
          for entry in subprocess.check_output(['git', 'ls-files', '--stage', '-z']).split(b'\0'):
              if not entry:
                  continue
              meta, raw_name = entry.split(b'\t', 1)
              mode, oid, stage = meta.split()
              if mode != b'120000':
                  continue
              path = Path(os.fsdecode(raw_name))
              expected = subprocess.check_output(['git', 'cat-file', 'blob', oid.decode()], env={**os.environ, 'GIT_NO_REPLACE_OBJECTS': '1'})
              native = os.readlink(path) if path.is_symlink() else None
              assert canonical[path.as_posix()] == hashlib.sha256(expected).hexdigest()
              links.append({'path': path.as_posix(), 'native': native, 'git_target': os.fsdecode(expected),
                            'canonical_sha256': canonical[path.as_posix()], 'is_native_link': path.is_symlink()})
          licenses = [row for row in links if row['path'].endswith('/LICENSE-MIT')]
          assert len(licenses) == 6 and all(row['is_native_link'] and '\\' in row['native'] for row in licenses)
          proof = {'purpose': 'Actual Windows native-link diagnostic only; never certification',
                   'candidate': os.environ['PROBE_CANDIDATE'], 'system': platform.system(), 'links': links}
          (Path(os.environ['RUNNER_TEMP']) / 'windows-native-links.json').write_text(json.dumps(proof, indent=2) + '\n')
          print('Six real native Windows license links match exact canonical Git blob identities.')
          PY
      - name: Run both real Windows production rows and export sealed evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          subprocess.run(['python3', '.github/scripts/operational-assurance.py', 'run',
                          '--candidate', os.environ['PROBE_CANDIDATE'], '--profile', 'windows',
                          '--out', str(temp / 'windows-raw')], stdin=subprocess.DEVNULL, check=True)
          subprocess.run(['python3', '.github/scripts/operational-assurance.py', 'export',
                          '--receipts', str(temp / 'windows-raw'), '--out', str(temp / 'windows-export')],
                         stdin=subprocess.DEVNULL, check=True)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-link-source-diagnostic
          path: ${{ runner.temp }}/windows-export/
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-native-link-inspection
          path: ${{ runner.temp }}/windows-native-links.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
  linux-collector:
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d50eec3028ee673f02f19cd5b9282db725fcdc02
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: windows-link-source-diagnostic
          path: ${{ runner.temp }}/windows-export
      - uses: actions/download-artifact@v8
        with:
          name: windows-native-link-inspection
          path: ${{ runner.temp }}/windows-inspection
      - name: Verify unmodified Windows receipts and source hashes on Linux
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, platform, sys
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root / '.github/scripts'))
          spec = importlib.util.spec_from_file_location('boundary', root / '.github/scripts/operational-assurance.py')
          boundary = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(boundary)
          assert platform.system() == 'Linux'
          candidate = os.environ['PROBE_CANDIDATE']
          boundary.clean(candidate)
          model = boundary.definition()
          binding = boundary.contract(boundary.CONTRACT)
          temp = Path(os.environ['RUNNER_TEMP'])
          receipt = boundary.verify_job(temp / 'windows-export', model, candidate, binding)
          assert receipt['status'] == 'PASS' and len(receipt['records']) == 2
          native = json.loads((temp / 'windows-inspection/windows-native-links.json').read_bytes())
          assert native['candidate'] == candidate and native['system'] == 'Windows'
          out = temp / 'collector-proof'
          out.mkdir()
          boundary.write(out / 'linux-collector-verification.json', {
              'purpose': 'Real Windows-to-Linux source and production-row verification; not release certification',
              'candidate': candidate, 'contract_digest': binding, 'status': 'PASS', 'records': 2,
              'windows_job_receipt_sha256': boundary.digest(temp / 'windows-export/job-receipt.json'),
              'windows_native_link_inspection_sha256': boundary.digest(temp / 'windows-inspection/windows-native-links.json'),
              'source_sha256': boundary.sources()})
          print('PASS: exact native Windows producer evidence verified unchanged on Linux.')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-linux-collector-verification
          path: ${{ runner.temp }}/collector-proof/
          if-no-files-found: error
          retention-days: 7
          overwrite: false
