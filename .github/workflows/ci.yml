name: CI

on:
  push:
    branches: ["main", "kbd/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: 1
  # rust-toolchain.toml pins the same version; keep both in step (cr-41).
  PINNED_TOOLCHAIN: "1.99.1"
  # cargo-udeps needs a nightly compiler. Dated, so the job does not move under us;
  # bump deliberately (cr-39). Tool versions: cargo-udeps 0.1.61, cargo-shear 1.14.0,
  # cargo-semver-checks 0.51.0 (pinned in the jobs below).
  UDEPS_NIGHTLY: "nightly-2026-10-02"

# Every cargo invocation is --locked (Cargo.lock is committed) and --workspace
# (the repository root is both the facade package and the workspace root).
# The Postgres suites (crates/parking-lot-pg/tests) and the facade's Postgres config
# test need Docker and are #[ignore]d: the `test` job compiles them but skips them,
# and the `postgres` job (cr-36) runs them with --run-ignored on PG 17 and PG 18.
# The Iggy suite (crates/parking-lot-iggy/tests) is #[ignore]d the same way and the
# `iggy` job (cr-32) runs it against the digest-pinned apache/iggy server.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    # Pinned toolchain only: clippy on the MSRV (1.95) would warn about lints that
    # exist only on 1.99 (unused_async_trait_impl), so MSRV is covered by `test`.
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.99.1" # pinned (rust-toolchain.toml)
          - "1.95"   # MSRV (workspace.package.rust-version)
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.toolchain }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # Build first so the watchdog below bounds test execution, not a cold compile.
      - name: Build tests
        run: cargo +${{ matrix.toolchain }} nextest run --workspace --all-features --locked --no-run
      - name: Run tests (suite-level watchdog, 5 minutes)
        timeout-minutes: 5
        # --no-tests=fail: a run that finds no tests is a failure, not a pass.
        run: cargo +${{ matrix.toolchain }} nextest run --workspace --all-features --locked --no-fail-fast --no-tests=fail
      - name: Run doctests (nextest does not run them)
        timeout-minutes: 5
        run: cargo +${{ matrix.toolchain }} test --workspace --all-features --locked --doc

  loom:
    # The loom models of the scheduling core (crates/parking-lot-core/tests/loom_*.rs)
    # and their negative controls. The models compile only under
    # `--cfg parking_lot_loom`, so the `test` job never builds them. Each leg is one
    # cfg build (RUSTFLAGS changes every fingerprint) with a cache of its own, so the
    # legs neither rebuild the main caches nor each other's. The models themselves
    # run in about a second; the build is the cost, so the job runs on every push and
    # pull request rather than on a schedule.
    #
    # `models` must pass. Every other leg injects one defect with
    # `--cfg parking_lot_negative_control="<id>"` and requires each listed model to
    # FAIL: a control that passes means the model no longer detects the defect it was
    # written for. A failure counts only when a model assertion fired (libtest's
    # `test result: FAILED`, or a panic raised in parking-lot-core when loom aborts on
    # a second panic while unwinding); the build runs first, so a compile error can
    # never stand in for it. The lists are every model the control is known to break
    # (s-20-depth and s-20-order break only loom_at_depth: loom_skip_ahead never
    # reaches the at-depth path). Issue #79 extends this to the non-loom controls: one more leg per
    # control, with a nextest filter in place of the model list.
    name: Loom (${{ matrix.control }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - control: models
            expect: pass
            models: loom_capacity loom_wakeup loom_vector loom_skip_ahead loom_at_depth
          - control: s-1 # no capacity check in the semaphore
            expect: fail
            models: loom_capacity loom_wakeup loom_skip_ahead loom_at_depth
          - control: s-2 # admission and park in separate critical sections, no drain
            expect: fail
            models: loom_capacity loom_wakeup loom_vector loom_skip_ahead loom_at_depth
          - control: s-19 # only the total dimension is checked
            expect: fail
            models: loom_vector
          - control: s-20 # the starvation guard never engages
            expect: fail
            models: loom_skip_ahead loom_at_depth
          - control: s-20-depth # at-depth skips are not charged to the head
            expect: fail
            models: loom_at_depth
          - control: s-20-order # at-depth start ahead of a higher-priority item that fits
            expect: fail
            models: loom_at_depth
    env:
      LOOM_MAX_PREEMPTIONS: "3"
      CONTROL: ${{ matrix.control }}
      EXPECT: ${{ matrix.expect }}
      MODELS: ${{ matrix.models }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: loom-${{ matrix.control }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Loom models (${{ matrix.control }}, expect ${{ matrix.expect }})
        run: |
          set -euo pipefail
          # The quotes in RUSTFLAGS are literal on purpose: cargo splits it on spaces
          # and rustc takes `--cfg parking_lot_negative_control="s-1"` as written.
          RUSTFLAGS="--cfg parking_lot_loom"
          if [ "$CONTROL" != models ]; then
            # shellcheck disable=SC2089
            RUSTFLAGS="$RUSTFLAGS --cfg parking_lot_negative_control=\"$CONTROL\""
          fi
          # shellcheck disable=SC2090
          export RUSTFLAGS
          read -r -a models <<< "$MODELS"
          targets=()
          for model in "${models[@]}"; do targets+=(--test "$model"); done
          # Build first: a build error must not count as the failure a control needs.
          cargo test -p prometheus-parking-lot-core --locked "${targets[@]}" --no-run
          log="$(mktemp)"
          status=0
          for model in "${models[@]}"; do
            set +e
            cargo test -p prometheus-parking-lot-core --locked --test "$model" 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            set -e
            failed=no
            if grep -q -e '^test result: FAILED' -e 'panicked at crates/parking-lot-core/' "$log"; then
              failed=yes
            fi
            if [ "$EXPECT" = pass ]; then
              if [ "$rc" -eq 0 ]; then
                echo "PASS: $model"
              else
                echo "::error title=Loom model failed::$model failed (exit $rc)"
                status=1
              fi
            elif [ "$rc" -ne 0 ] && [ "$failed" = yes ]; then
              finding="$(grep -m1 -A1 'panicked at crates/parking-lot-core/' "$log" | tail -n1)"
              echo "PASS: negative control $CONTROL makes $model fail as required: $finding"
            elif [ "$rc" -eq 0 ]; then
              echo "::error title=Negative control not detected::$model PASSED under --cfg parking_lot_negative_control=\"$CONTROL\"; it must fail. The model no longer detects the defect this control injects."
              status=1
            else
              echo "::error title=Negative control inconclusive::$model exited $rc under $CONTROL without a failing test; expected a test failure, not an error."
              status=1
            fi
          done
          exit "$status"

  loom-oa11:
    # Additive ledger/kind-release models; incumbent Loom scenarios stay intact.
    name: Loom OA-11 (${{ matrix.control }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - control: models-core
            package: prometheus-parking-lot-core
            target: loom_kind_release
            expect: pass
            oracle: loom_kind_release_parallel_returns_preserve_all_kind_units
            positive: loom_kind_release_reacquire_publishes_previous_holder_work
            diagnostic: OA-11 kind release lost a GpuVram subtraction
          - control: models-runtime
            package: prometheus-parking-lot-runtime-tokio
            target: loom_ledger
            expect: pass
            oracle: ledger::loom_ledger::loom_ledger_submit_shutdown_cannot_both_miss
            positive: ledger::loom_ledger::loom_ledger_settlement_publishes_finished_before_zero
            diagnostic: OA-11 ledger admission and shutdown both missed accepted work
          - control: oa-11-kind-release
            package: prometheus-parking-lot-core
            target: loom_kind_release
            expect: fail
            oracle: loom_kind_release_parallel_returns_preserve_all_kind_units
            positive: loom_kind_release_reacquire_publishes_previous_holder_work
            diagnostic: OA-11 kind release lost a GpuVram subtraction
          - control: oa-11-ledger-order
            package: prometheus-parking-lot-runtime-tokio
            target: loom_ledger
            expect: fail
            oracle: ledger::loom_ledger::loom_ledger_submit_shutdown_cannot_both_miss
            positive: ledger::loom_ledger::loom_ledger_settlement_publishes_finished_before_zero
            diagnostic: OA-11 ledger admission and shutdown both missed accepted work
    env:
      LOOM_MAX_PREEMPTIONS: "3"
      CARGO_TARGET_DIR: target/loom-oa11-${{ matrix.control }}
      CONTROL: ${{ matrix.control }}
      PACKAGE: ${{ matrix.package }}
      MODEL: ${{ matrix.target }}
      EXPECT: ${{ matrix.expect }}
      ORACLE: ${{ matrix.oracle }}
      POSITIVE: ${{ matrix.positive }}
      DIAGNOSTIC: ${{ matrix.diagnostic }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: loom-oa11-${{ matrix.control }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build, discover and classify bounded OA-11 models
        run: |
          set -euo pipefail
          RUSTFLAGS="--cfg parking_lot_loom"
          if [ "$EXPECT" = fail ]; then
            RUSTFLAGS="$RUSTFLAGS --cfg parking_lot_negative_control=\"$CONTROL\""
          fi
          export RUSTFLAGS
          mkdir -p oa11-logs
          if [ "$MODEL" = loom_ledger ]; then
            model_args=(--lib ledger::loom_ledger::)
          else
            model_args=(--test "$MODEL")
          fi
          # Keep compile/discovery/run evidence separate. Compile failure, zero
          # discovery, timeout and abnormal termination cannot satisfy a control.
          cargo test -p "$PACKAGE" --locked "${model_args[@]}" --no-run 2>&1 | tee oa11-logs/build.log
          cargo test -p "$PACKAGE" --locked "${model_args[@]}" -- --list 2>&1 | tee oa11-logs/discovery.log
          grep -Fx "$ORACLE: test" oa11-logs/discovery.log
          grep -Fx "$POSITIVE: test" oa11-logs/discovery.log
          awk '/: test$/{n++} END{exit n!=2}' oa11-logs/discovery.log
          set +e
          cargo test -p "$PACKAGE" --locked "${model_args[@]}" -- --test-threads=1 2>&1 | tee oa11-logs/run.log
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > oa11-logs/exit-status.txt
          if [ "$EXPECT" = pass ]; then
            test "$rc" -eq 0
            grep -F '2 passed; 0 failed;' oa11-logs/run.log
          else
            test "$rc" -eq 101
            grep -Fx "test $ORACLE ... FAILED" oa11-logs/run.log
            grep -Fx "test $POSITIVE ... ok" oa11-logs/run.log
            grep -F "$DIAGNOSTIC" oa11-logs/run.log
            grep -F '1 passed; 1 failed;' oa11-logs/run.log
          fi
      - name: Preserve raw OA-11 model evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loom-oa11-${{ matrix.control }}
          path: oa11-logs/

  negative-control-manifest:
    # OA-12 derives its matrix from the checked source inventory. Hand-maintained
    # YAML rows cannot quietly omit s-10/s-22, variants, or later OA controls.
    name: Negative-control inventory
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: manifest
        run: |
          matrix=$(python3 .github/scripts/tests/negative-controls.py matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  negative-controls:
    name: Negative control (${{ matrix.id }})
    needs: negative-control-manifest
    runs-on: ${{ matrix.adapter == 'browser' && (vars.WASM_BROWSER_RUNNER || 'ubuntu-latest') || matrix.adapter == 'upgrade' && (vars.PG_UPGRADE_RUNNER || 'ubuntu-latest') || 'ubuntu-latest' }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.negative-control-manifest.outputs.matrix) }}
    env:
      WASM_BROWSER_BIN: ${{ vars.WASM_CHROME_BIN }}
      CHROMEDRIVER: ${{ vars.WASM_CHROMEDRIVER_BIN }}
      OA12_PG17_IMAGE: ${{ vars.PG_UPGRADE_PG17_IMAGE_ID }}
      OA12_PG18_IMAGE: ${{ vars.PG_UPGRADE_PG18_IMAGE_ID }}
      OA12_UPGRADE_IMAGE: ${{ vars.PG_UPGRADE_IMAGE_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: oa12-${{ matrix.id }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: "false"
          cache-directories: |
            target/oa12/${{ matrix.id }}/normal
            target/oa12/${{ matrix.id }}/mutant
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.149
      - uses: taiki-e/install-action@v2
        if: matrix.adapter == 'browser'
        with:
          tool: wasm-bindgen@0.2.129
      - name: Provision pinned Chromium on the default hosted runner
        if: matrix.adapter == 'browser' && runner.environment == 'github-hosted' && vars.WASM_BROWSER_RUNNER == '' && vars.WASM_CHROME_BIN == '' && vars.WASM_CHROMEDRIVER_BIN == ''
        env:
          BOOTSTRAP_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 .github/scripts/bootstrap-hosted-browser.py
      - uses: docker/setup-buildx-action@v4
        if: matrix.adapter == 'pg'
      - name: Build the real project PostgreSQL collaborator
        if: matrix.adapter == 'pg'
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/postgres${{ matrix.pg }}/Dockerfile
          tags: parking-lot-pg:${{ matrix.pg }}
          load: true
          push: false
          cache-from: type=gha,scope=parking-lot-pg-${{ matrix.pg }}
          cache-to: type=gha,mode=max,scope=parking-lot-pg-${{ matrix.pg }},ignore-error=true
      # Every Cargo process is awaited by one runner. Baseline and mutant use
      # different target directories/RUSTFLAGS; compile/discovery failures and
      # timeouts never count as a designated assertion. Browser/upgrade tools
      # must be provisioned before validation (hosted browser setup above, or
      # explicit preconfigured environments); missing inputs fail with BLOCKED.
      - name: Compile, discover and exercise the production defect oracle
        run: python3 .github/scripts/tests/negative-controls.py run --case '${{ matrix.id }}' --output '${{ runner.temp }}/oa12-${{ matrix.id }}'
      - name: Preserve all raw control evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oa12-${{ matrix.id }}
          path: ${{ runner.temp }}/oa12-${{ matrix.id }}/
          if-no-files-found: error

  negative-control-completeness:
    name: Negative-control completeness and verifier defects
    if: always()
    needs: [negative-control-manifest, negative-controls]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: oa12-*
          path: ${{ runner.temp }}/oa12-packet
      - name: Require every actual row and reject omission/undetected defects
        run: |
          # Download-artifact keeps each artifact's name as its directory.
          # Normalize that directory name to the source-owned case identity.
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'oa12-packet'
          for path in root.glob('oa12-*'):
              path.rename(path.with_name(path.name.removeprefix('oa12-')))
          PY
          python3 .github/scripts/tests/negative-controls.py aggregate --receipts '${{ runner.temp }}/oa12-packet' --candidate '${{ github.sha }}' --output '${{ runner.temp }}/oa12-summary.json'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: oa12-summary
          path: ${{ runner.temp }}/oa12-summary.json
          if-no-files-found: error

  postgres:
    # cr-36. Every Docker-gated Postgres test, once per supported major (17, 18):
    # the parking-lot-pg crate's suites (lease queue, mailbox, pgmq, per-table
    # autovacuum, image smoke) and the facade's Postgres config test. The `test`
    # job skips them because they are #[ignore]d.
    #
    # Image: docker/postgres<N>/Dockerfile builds Postgres + pgmq (pgmq is compiled
    # from a pinned tag, the slow step). It is built once per leg with buildx and
    # the GitHub Actions layer cache, and loaded into the runner's Docker engine as
    # parking-lot-pg:<N>. The tests' helper (tests/support) starts with
    # `docker image inspect parking-lot-pg:<N>` and only builds when that fails, so
    # testcontainers uses this image and never pulls or rebuilds.
    # PARKING_LOT_PG_MAJOR selects the major in every suite.
    name: Postgres ${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pg: ["17", "18"]
    env:
      PARKING_LOT_PG_MAJOR: ${{ matrix.pg }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
      # Same flags, features and toolchain as the `test` job's pinned leg, so this
      # job restores the cache that job saves on main and saves nothing itself.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ env.PINNED_TOOLCHAIN }}
          save-if: "false"
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: docker/setup-buildx-action@v4
      - name: Build parking-lot-pg:${{ matrix.pg }} (layer cache)
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/postgres${{ matrix.pg }}/Dockerfile
          tags: parking-lot-pg:${{ matrix.pg }}
          # Into the local engine, where `docker image inspect` and testcontainers look.
          load: true
          push: false
          # One cache scope per major. ignore-error: a cache outage (or a fork's
          # read-only token) must not fail the build; the layers are just rebuilt.
          cache-from: type=gha,scope=parking-lot-pg-${{ matrix.pg }}
          cache-to: type=gha,mode=max,scope=parking-lot-pg-${{ matrix.pg }},ignore-error=true
      - name: Image is present and is the requested major
        run: |
          docker image inspect parking-lot-pg:${{ matrix.pg }} --format '{{ index .Config.Labels "ai.prometheus.pg.major" }}' | grep -qx '${{ matrix.pg }}'
      # Build first so the timeout below bounds test execution, not a cold compile.
      - name: Build tests
        run: cargo nextest run --workspace --all-features --locked --no-run
      - name: Docker-gated Postgres tests (PG ${{ matrix.pg }})
        timeout-minutes: 25
        # --no-tests=fail: a filter that matches nothing is a failure, not a pass.
        run: >
          cargo nextest run --workspace --all-features --locked
          --run-ignored all --no-fail-fast --no-tests=fail
          -E '(package(prometheus-parking-lot-pg) & not binary(postgres_upgrade)) | test(config_postgres_example_builds_against_pg18) | test(config_pgmq_example_opens_the_queue_against_pg18) | test(pool_sigkill_) | test(shutdown_durable_pg_)'

  iggy:
    # cr-32 / S-11. The Docker-gated Iggy tests: a subscriber receives mailbox.ready
    # and replays from an offset, one idempotency key gives one message id, and a
    # paused server adds no dispatch latency. The `test` job skips them because they
    # are #[ignore]d. The server image is pinned by tag and digest in
    # crates/parking-lot-iggy/tests/support/mod.rs (IGGY_TAG); testcontainers pulls it.
    name: Iggy events
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
      # Same flags, features and toolchain as the `test` job's pinned leg, so this
      # job restores the cache that job saves on main and saves nothing itself.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ env.PINNED_TOOLCHAIN }}
          save-if: "false"
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # Build first so the timeout below bounds test execution, not a cold compile.
      - name: Build tests
        run: cargo nextest run -p prometheus-parking-lot-iggy --all-features --locked --no-run
      - name: Docker-gated Iggy tests
        timeout-minutes: 15
        # --no-tests=fail: a filter that matches nothing is a failure, not a pass.
        run: >
          cargo nextest run -p prometheus-parking-lot-iggy --all-features --locked
          --run-ignored all --no-fail-fast --no-tests=fail -E 'test(iggy_)'

  wasm:
    # cr-38 / S-14. Everything in the wasm crate is cfg(target_arch = "wasm32"), so the
    # native jobs compile nothing of it: this job is the only one that builds it. Runs
    # on the pinned toolchain and the MSRV; lints, docs and the graph gate only on the
    # pinned one. Tests run in Node.js through wasm-bindgen-test-runner.
    name: Wasm (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.99.1" # pinned (rust-toolchain.toml)
          - "1.95"   # MSRV (workspace.package.rust-version)
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-${{ matrix.toolchain }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the core and wasm crates for wasm32-unknown-unknown
        run: cargo +${{ matrix.toolchain }} check --locked --target wasm32-unknown-unknown -p prometheus-parking-lot-core -p prometheus-parking-lot-wasm --all-targets
      - name: Check the facade for wasm32-unknown-unknown (default features are native-only)
        run: |
          cargo +${{ matrix.toolchain }} check --locked --target wasm32-unknown-unknown -p prometheus_parking_lot --no-default-features
          # The default features pull in tokio's multi-thread runtime (mio), which does not
          # build for wasm32; the facade docs say to turn them off. Prove the claim.
          if cargo +${{ matrix.toolchain }} check --locked --target wasm32-unknown-unknown -p prometheus_parking_lot >/dev/null 2>&1; then
            echo "::error::the facade now builds for wasm32 with default features: update README.md, docs/API.md and src/lib.rs, then drop this assertion"
            exit 1
          fi
      - name: Core and wasm dependency graph (no tokio, sqlx, sea-orm, redb, reqwest)
        if: matrix.toolchain == env.PINNED_TOOLCHAIN
        run: .github/scripts/check-wasm-graph.sh
      - name: Clippy (wasm32)
        if: matrix.toolchain == env.PINNED_TOOLCHAIN
        run: cargo clippy --locked --target wasm32-unknown-unknown -p prometheus-parking-lot-wasm --all-targets --all-features -- -D warnings
      - name: Docs (wasm32)
        if: matrix.toolchain == env.PINNED_TOOLCHAIN
        run: cargo doc --locked --no-deps --target wasm32-unknown-unknown -p prometheus-parking-lot-wasm
        env:
          RUSTDOCFLAGS: "-D warnings"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # The runner must be the same version as the wasm-bindgen crate in Cargo.lock, or
      # the test binary is rejected with a schema-version mismatch.
      - name: wasm-bindgen version from Cargo.lock
        id: wbg
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)
          test -n "$version" || { echo "::error::wasm-bindgen is not in Cargo.lock"; exit 1; }
          echo "wasm-bindgen $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wbg.outputs.version }}
      - name: wasm-bindgen-test (smoke, capacity, priority, budget; Node.js)
        timeout-minutes: 10
        # .cargo/config.toml sets wasm-bindgen-test-runner as the wasm32 runner.
        # OA-13 retains Node and now requires exact nonzero discovery/execution.
        run: python3 .github/scripts/tests/browser-assurance.py --mode node --toolchain '${{ matrix.toolchain }}' --output '${{ runner.temp }}/oa13-node-${{ matrix.toolchain }}'
      - name: Preserve raw Node WASM evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oa13-node-${{ matrix.toolchain }}
          path: ${{ runner.temp }}/oa13-node-${{ matrix.toolchain }}/
          if-no-files-found: error

  wasm-browser:
    # OA-13: pinned local headless Chromium, not a Node-only browser claim.
    # Default hosted CI provisions the checked pin in a separate setup step.
    # Explicit runner/path settings retain the preprovisioned environment contract.
    name: Chromium WASM (${{ matrix.control }})
    runs-on: ${{ vars.WASM_BROWSER_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        control: [browser, browser-negative]
    env:
      WASM_BROWSER_BIN: ${{ vars.WASM_CHROME_BIN }}
      CHROMEDRIVER: ${{ vars.WASM_CHROMEDRIVER_BIN }}
      CARGO_TARGET_DIR: target/wasm-oa13-${{ matrix.control }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-oa13-${{ matrix.control }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          # Exact CLI version matches Cargo.lock and the checked manifest.
          tool: wasm-bindgen@0.2.129
      - name: Provision pinned Chromium on the default hosted runner
        if: runner.environment == 'github-hosted' && vars.WASM_BROWSER_RUNNER == '' && vars.WASM_CHROME_BIN == '' && vars.WASM_CHROMEDRIVER_BIN == ''
        env:
          BOOTSTRAP_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 .github/scripts/bootstrap-hosted-browser.py
      - name: Build, discover and classify real Chromium WASM suites
        run: python3 .github/scripts/tests/browser-assurance.py --mode '${{ matrix.control }}' --output '${{ runner.temp }}/oa13-${{ matrix.control }}'
      - name: Preserve raw Chromium and negative-control evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oa13-${{ matrix.control }}
          path: ${{ runner.temp }}/oa13-${{ matrix.control }}/
          if-no-files-found: error

  udeps:
    # cr-39. Unused dependencies fail the build. cargo-udeps compiles every target with
    # all features on a dated nightly; the wasm-only dependencies are only compiled for
    # wasm32, so the wasm crate is excluded from the native pass and covered by its own
    # wasm32 pass (natively its whole body is cfg(target_arch = "wasm32"), which makes
    # udeps report its core dependency as unused: a false positive of the host target).
    # cargo-shear is the fast static pass: it also catches [workspace.dependencies]
    # entries no member uses, which udeps cannot see. The standalone binding
    # workspaces (not root members) are checked by shear here and udeps for the
    # bindgen and queue-service workspaces; the Tauri shell is shear-only (a udeps
    # build of Tauri is minutes of compile for a two-line manifest).
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.UDEPS_NIGHTLY }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: udeps
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            .
            bindings/uniffi-bindgen
            bindings/tauri-desktop
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps@0.1.61,cargo-shear@1.14.0
      - name: cargo shear (root workspace and the standalone binding workspaces)
        run: |
          cargo shear
          (cd bindings/uniffi-bindgen && cargo shear)
          (cd bindings/tauri-desktop && cargo shear)
      - name: cargo udeps (native, all targets, all features)
        run: cargo +${{ env.UDEPS_NIGHTLY }} udeps --workspace --exclude prometheus-parking-lot-wasm --all-targets --all-features --locked
      - name: cargo udeps (wasm32, core and wasm)
        run: cargo +${{ env.UDEPS_NIGHTLY }} udeps --locked --target wasm32-unknown-unknown -p prometheus-parking-lot-core -p prometheus-parking-lot-wasm --all-targets
      - name: cargo udeps (bindgen and Tauri queue-service workspaces)
        run: |
          (cd bindings/uniffi-bindgen && cargo +${{ env.UDEPS_NIGHTLY }} udeps --locked --all-targets)
          (cd bindings/tauri-desktop && cargo +${{ env.UDEPS_NIGHTLY }} udeps --locked -p parking-lot-tauri-queue-service --all-targets)

  semver:
    # cr-39. cargo-semver-checks against the newest release tag (script header explains
    # why the baseline is a tag and not the registry). fetch-depth 0 and tags: the
    # baseline is a git revision. Inactive (passes with a notice) until v0.3.0 exists.
    name: Semver checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: semver
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.51.0
      - run: .github/scripts/semver-check.sh

  orphan-tests:
    # cr-35: every .rs file under a tests/ directory must be compiled by a Cargo
    # target. Static check (cargo metadata + `mod` resolution); no build needed.
    name: Orphan tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
      - run: python3 .github/scripts/check-orphan-tests.py

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  bench:
    # cr-40. The four criterion suites (benches/README.md) in a reduced configuration:
    # 1 s warm-up, 3 s measurement, 20 samples per benchmark, instead of the local
    # 2 s / 5 s / 50. The latency percentile and utilization passes run in full.
    # Report-only: a slower number never fails the job (benches/README.md,
    # "Regression policy"). On main the run is saved as criterion's `main` baseline
    # (actions/cache, keyed by commit); pull requests restore the newest main
    # baseline and compare against it. Results: the job summary
    # (.github/scripts/bench-report.py) and the bench-results artifact (criterion
    # JSON, the latency and utilization reports, machine metadata).
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CRITERION_HOME: ${{ github.workspace }}/bench-results/criterion
      PARKING_LOT_BENCH_REPORT_DIR: ${{ github.workspace }}/bench-results/report
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
      # The bench profile is optimized: a cache of its own.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore the main baseline
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: bench-results/criterion
          key: bench-baseline-${{ github.sha }}
          restore-keys: bench-baseline-
      # Build first so the timeout below bounds the measurement, not a cold compile.
      - name: Build the benchmarks
        run: cargo bench --all-features --locked --bench components --bench throughput --bench latency --bench utilization --no-run
      - name: Run the benchmarks (reduced configuration)
        timeout-minutes: 25
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            mode=(--save-baseline main)
          else
            mode=(--baseline-lenient main)
          fi
          cargo bench --all-features --locked --bench components --bench throughput --bench latency --bench utilization -- --noplot --warm-up-time 1 --measurement-time 3 --sample-size 20 "${mode[@]}"
      - name: Summary
        if: always()
        run: python3 .github/scripts/bench-report.py --criterion bench-results/criterion --reports bench-results/report --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-results-${{ github.sha }}
          path: bench-results
          retention-days: 90
      - name: Save the main baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: bench-results/criterion
          key: bench-baseline-${{ github.sha }}

  deny:
    name: Deny (licenses / advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # --workspace: without it cargo-deny walks only the facade package's graph and
          # never sees the crates the facade does not depend on (the FFI crate, cr-44).
          arguments: --workspace --all-features --locked

  supply-chain:
    # cr-51. fetch-depth 0: gitleaks and ancestry checks need full history; a shallow
    # clone would silently pass them. Scripts: .github/scripts/supply-chain.sh.
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: supply-chain
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # taiki-e/install-action has no gitleaks entry; install the pinned release
      # binary and verify it against the release checksum file.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "$base/$tarball"
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " ${tarball}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
      # --- blocking gates ---
      - name: No tracked credential paths
        run: .github/scripts/supply-chain.sh tracked-credentials
      - name: Secrets in new commits (gitleaks, PR or push range)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            range="-1 $HEAD_SHA"
          else
            range="$BASE_SHA..$HEAD_SHA"
          fi
          .github/scripts/supply-chain.sh secrets-diff "$range"
      - name: Pre-purge root set (inert while .github/pre-purge-roots.txt is empty)
        run: .github/scripts/supply-chain.sh pre-purge
      - name: Package allowlist (cargo package --list per crate)
        run: .github/scripts/supply-chain.sh package-allowlist
      # Empty roots are informational; populated roots arm blocking checks.
      - name: "Pre-purge, informational: path history of purged credential files"
        run: .github/scripts/supply-chain.sh path-history
      - name: "Pre-purge, informational: gitleaks over full history"
        run: .github/scripts/supply-chain.sh secrets-history

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        timeout-minutes: 15
        run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info
      - name: Upload to Codecov (optional)
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: lcov.info
          fail_ci_if_error: false
