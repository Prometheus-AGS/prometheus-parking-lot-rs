name: CI

on:
  push:
    branches: ["main", "kbd/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: 1
  # rust-toolchain.toml pins the same version; keep both in step (cr-41).
  PINNED_TOOLCHAIN: "1.99.1"
  # cargo-udeps needs a nightly compiler. Dated, so the job does not move under us;
  # bump deliberately (cr-39). Tool versions: cargo-udeps 0.1.61, cargo-shear 1.14.0,
  # cargo-semver-checks 0.51.0 (pinned in the jobs below).
  UDEPS_NIGHTLY: "nightly-2026-10-02"

# Every cargo invocation is --locked (Cargo.lock is committed) and --workspace
# (the repository root is both the facade package and the workspace root).
# The Postgres suites (crates/parking-lot-pg/tests) and the facade's Postgres config
# test need Docker and are #[ignore]d: the `test` job compiles them but skips them,
# and the `postgres` job (cr-36) runs them with --run-ignored on PG 17 and PG 18.
# The Iggy suite (crates/parking-lot-iggy/tests) is #[ignore]d the same way and the
# `iggy` job (cr-32) runs it against the digest-pinned apache/iggy server.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    # Pinned toolchain only: clippy on the MSRV (1.95) would warn about lints that
    # exist only on 1.99 (unused_async_trait_impl), so MSRV is covered by `test`.
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.99.1" # pinned (rust-toolchain.toml)
          - "1.95"   # MSRV (workspace.package.rust-version)
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.toolchain }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # Build first so the watchdog below bounds test execution, not a cold compile.
      - name: Build tests
        run: cargo +${{ matrix.toolchain }} nextest run --workspace --all-features --locked --no-run
      - name: Run tests (suite-level watchdog, 5 minutes)
        timeout-minutes: 5
        # --no-tests=fail: a run that finds no tests is a failure, not a pass.
        run: cargo +${{ matrix.toolchain }} nextest run --workspace --all-features --locked --no-fail-fast --no-tests=fail
      - name: Run doctests (nextest does not run them)
        timeout-minutes: 5
        run: cargo +${{ matrix.toolchain }} test --workspace --all-features --locked --doc

  postgres:
    # cr-36. Every Docker-gated Postgres test, once per supported major (17, 18):
    # the parking-lot-pg crate's suites (lease queue, mailbox, pgmq, per-table
    # autovacuum, image smoke) and the facade's Postgres config test. The `test`
    # job skips them because they are #[ignore]d.
    #
    # Image: docker/postgres<N>/Dockerfile builds Postgres + pgmq (pgmq is compiled
    # from a pinned tag, the slow step). It is built once per leg with buildx and
    # the GitHub Actions layer cache, and loaded into the runner's Docker engine as
    # parking-lot-pg:<N>. The tests' helper (tests/support) starts with
    # `docker image inspect parking-lot-pg:<N>` and only builds when that fails, so
    # testcontainers uses this image and never pulls or rebuilds.
    # PARKING_LOT_PG_MAJOR selects the major in every suite.
    name: Postgres ${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pg: ["17", "18"]
    env:
      PARKING_LOT_PG_MAJOR: ${{ matrix.pg }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
      # Same flags, features and toolchain as the `test` job's pinned leg, so this
      # job restores the cache that job saves on main and saves nothing itself.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ env.PINNED_TOOLCHAIN }}
          save-if: "false"
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: docker/setup-buildx-action@v4
      - name: Build parking-lot-pg:${{ matrix.pg }} (layer cache)
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/postgres${{ matrix.pg }}/Dockerfile
          tags: parking-lot-pg:${{ matrix.pg }}
          # Into the local engine, where `docker image inspect` and testcontainers look.
          load: true
          push: false
          # One cache scope per major. ignore-error: a cache outage (or a fork's
          # read-only token) must not fail the build; the layers are just rebuilt.
          cache-from: type=gha,scope=parking-lot-pg-${{ matrix.pg }}
          cache-to: type=gha,mode=max,scope=parking-lot-pg-${{ matrix.pg }},ignore-error=true
      - name: Image is present and is the requested major
        run: |
          docker image inspect parking-lot-pg:${{ matrix.pg }} --format '{{ index .Config.Labels "ai.prometheus.pg.major" }}' | grep -qx '${{ matrix.pg }}'
      # Build first so the timeout below bounds test execution, not a cold compile.
      - name: Build tests
        run: cargo nextest run --workspace --all-features --locked --no-run
      - name: Docker-gated Postgres tests (PG ${{ matrix.pg }})
        timeout-minutes: 25
        # --no-tests=fail: a filter that matches nothing is a failure, not a pass.
        run: >
          cargo nextest run --workspace --all-features --locked
          --run-ignored all --no-fail-fast --no-tests=fail
          -E 'package(prometheus-parking-lot-pg) | test(config_postgres_example_builds_against_pg18) | test(config_pgmq_example_opens_the_queue_against_pg18) | test(pool_sigkill_) | test(shutdown_durable_pg_)'

  iggy:
    # cr-32 / S-11. The Docker-gated Iggy tests: a subscriber receives mailbox.ready
    # and replays from an offset, one idempotency key gives one message id, and a
    # paused server adds no dispatch latency. The `test` job skips them because they
    # are #[ignore]d. The server image is pinned by tag and digest in
    # crates/parking-lot-iggy/tests/support/mod.rs (IGGY_TAG); testcontainers pulls it.
    name: Iggy events
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
      # Same flags, features and toolchain as the `test` job's pinned leg, so this
      # job restores the cache that job saves on main and saves nothing itself.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ env.PINNED_TOOLCHAIN }}
          save-if: "false"
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # Build first so the timeout below bounds test execution, not a cold compile.
      - name: Build tests
        run: cargo nextest run -p prometheus-parking-lot-iggy --all-features --locked --no-run
      - name: Docker-gated Iggy tests
        timeout-minutes: 15
        # --no-tests=fail: a filter that matches nothing is a failure, not a pass.
        run: >
          cargo nextest run -p prometheus-parking-lot-iggy --all-features --locked
          --run-ignored all --no-fail-fast --no-tests=fail -E 'test(iggy_)'

  wasm:
    # cr-38 / S-14. Everything in the wasm crate is cfg(target_arch = "wasm32"), so the
    # native jobs compile nothing of it: this job is the only one that builds it. Runs
    # on the pinned toolchain and the MSRV; lints, docs and the graph gate only on the
    # pinned one. Tests run in Node.js through wasm-bindgen-test-runner.
    name: Wasm (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.99.1" # pinned (rust-toolchain.toml)
          - "1.95"   # MSRV (workspace.package.rust-version)
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-${{ matrix.toolchain }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the core and wasm crates for wasm32-unknown-unknown
        run: cargo +${{ matrix.toolchain }} check --locked --target wasm32-unknown-unknown -p prometheus-parking-lot-core -p prometheus-parking-lot-wasm --all-targets
      - name: Core and wasm dependency graph (no tokio, sqlx, sea-orm, redb, reqwest)
        if: matrix.toolchain == env.PINNED_TOOLCHAIN
        run: .github/scripts/check-wasm-graph.sh
      - name: Clippy (wasm32)
        if: matrix.toolchain == env.PINNED_TOOLCHAIN
        run: cargo clippy --locked --target wasm32-unknown-unknown -p prometheus-parking-lot-wasm --all-targets --all-features -- -D warnings
      - name: Docs (wasm32)
        if: matrix.toolchain == env.PINNED_TOOLCHAIN
        run: cargo doc --locked --no-deps --target wasm32-unknown-unknown -p prometheus-parking-lot-wasm
        env:
          RUSTDOCFLAGS: "-D warnings"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # The runner must be the same version as the wasm-bindgen crate in Cargo.lock, or
      # the test binary is rejected with a schema-version mismatch.
      - name: wasm-bindgen version from Cargo.lock
        id: wbg
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)
          test -n "$version" || { echo "::error::wasm-bindgen is not in Cargo.lock"; exit 1; }
          echo "wasm-bindgen $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wbg.outputs.version }}
      - name: wasm-bindgen-test (smoke, capacity, priority, budget; Node.js)
        timeout-minutes: 10
        # .cargo/config.toml sets wasm-bindgen-test-runner as the wasm32 runner.
        run: cargo +${{ matrix.toolchain }} test --locked --target wasm32-unknown-unknown -p prometheus-parking-lot-wasm

  udeps:
    # cr-39. Unused dependencies fail the build. cargo-udeps compiles every target with
    # all features on a dated nightly; the wasm-only dependencies are only compiled for
    # wasm32, so the wasm crate is excluded from the native pass and covered by its own
    # wasm32 pass (natively its whole body is cfg(target_arch = "wasm32"), which makes
    # udeps report its core dependency as unused: a false positive of the host target).
    # cargo-shear is the fast static pass: it also catches [workspace.dependencies]
    # entries no member uses, which udeps cannot see. The standalone binding
    # workspaces (not root members) are checked by shear here and udeps for the
    # bindgen and queue-service workspaces; the Tauri shell is shear-only (a udeps
    # build of Tauri is minutes of compile for a two-line manifest).
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.UDEPS_NIGHTLY }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: udeps
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            .
            bindings/uniffi-bindgen
            bindings/tauri-desktop
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps@0.1.61,cargo-shear@1.14.0
      - name: cargo shear (root workspace and the standalone binding workspaces)
        run: |
          cargo shear
          (cd bindings/uniffi-bindgen && cargo shear)
          (cd bindings/tauri-desktop && cargo shear)
      - name: cargo udeps (native, all targets, all features)
        run: cargo +${{ env.UDEPS_NIGHTLY }} udeps --workspace --exclude prometheus-parking-lot-wasm --all-targets --all-features --locked
      - name: cargo udeps (wasm32, core and wasm)
        run: cargo +${{ env.UDEPS_NIGHTLY }} udeps --locked --target wasm32-unknown-unknown -p prometheus-parking-lot-core -p prometheus-parking-lot-wasm --all-targets
      - name: cargo udeps (bindgen and Tauri queue-service workspaces)
        run: |
          (cd bindings/uniffi-bindgen && cargo +${{ env.UDEPS_NIGHTLY }} udeps --locked --all-targets)
          (cd bindings/tauri-desktop && cargo +${{ env.UDEPS_NIGHTLY }} udeps --locked -p parking-lot-tauri-queue-service --all-targets)

  semver:
    # cr-39. cargo-semver-checks against the newest release tag (script header explains
    # why the baseline is a tag and not the registry). fetch-depth 0 and tags: the
    # baseline is a git revision. Inactive (passes with a notice) until v0.3.0 exists.
    name: Semver checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: semver
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.51.0
      - run: .github/scripts/semver-check.sh

  orphan-tests:
    # cr-35: every .rs file under a tests/ directory must be compiled by a Cargo
    # target. Static check (cargo metadata + `mod` resolution); no build needed.
    name: Orphan tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
      - run: python3 .github/scripts/check-orphan-tests.py

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  deny:
    name: Deny (licenses / advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # --workspace: without it cargo-deny walks only the facade package's graph and
          # never sees the crates the facade does not depend on (the FFI crate, cr-44).
          arguments: --workspace --all-features --locked

  supply-chain:
    # cr-51. fetch-depth 0: gitleaks and ancestry checks need full history; a shallow
    # clone would silently pass them. Scripts: .github/scripts/supply-chain.sh.
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: supply-chain
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # taiki-e/install-action has no gitleaks entry; install the pinned release
      # binary and verify it against the release checksum file.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "$base/$tarball"
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " ${tarball}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
      # --- blocking gates ---
      - name: No tracked credential paths
        run: .github/scripts/supply-chain.sh tracked-credentials
      - name: Secrets in new commits (gitleaks, PR or push range)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            range="-1 $HEAD_SHA"
          else
            range="$BASE_SHA..$HEAD_SHA"
          fi
          .github/scripts/supply-chain.sh secrets-diff "$range"
      - name: Pre-purge root set (inert while .github/pre-purge-roots.txt is empty)
        run: .github/scripts/supply-chain.sh pre-purge
      - name: Package allowlist (cargo package --list per crate)
        run: .github/scripts/supply-chain.sh package-allowlist
      # --- informational until cr-15 purges history; never fail the job ---
      - name: "Pre-purge, informational: path history of purged credential files"
        continue-on-error: true
        run: .github/scripts/supply-chain.sh path-history
      - name: "Pre-purge, informational: gitleaks over full history"
        continue-on-error: true
        run: .github/scripts/supply-chain.sh secrets-history

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PINNED_TOOLCHAIN }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        timeout-minutes: 15
        run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info
      - name: Upload to Codecov (optional)
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: lcov.info
          fail_ci_if_error: false
