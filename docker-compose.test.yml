# Local Postgres substrate (CR-43): PostgreSQL + pgmq, tuned for queue workloads.
#
#   docker compose -f docker-compose.test.yml up -d --build postgres18
#   DATABASE_URL=postgres://postgres:postgres@localhost:5433/postgres
#
# The Rust integration tests do not need this file: the testcontainers helper in
# crates/parking-lot-pg/tests/support builds and starts the same images itself.

services:
  postgres18:
    image: parking-lot-pg:18
    build:
      context: docker
      dockerfile: postgres18/Dockerfile
    container_name: parking-lot-pg18
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # PG 17 for the version matrix.
  postgres17:
    image: parking-lot-pg:17
    build:
      context: docker
      dockerfile: postgres17/Dockerfile
    container_name: parking-lot-pg17
    profiles: ["matrix"]
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
