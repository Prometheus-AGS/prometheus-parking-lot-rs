[package]
name = "prometheus-parking-lot-pg"
description = "Postgres queue and mailbox backends for prometheus_parking_lot."
documentation = "https://docs.rs/prometheus-parking-lot-pg"
keywords = ["scheduler", "queue", "postgres", "ai"]
categories = ["asynchronous", "database"]
include = ["/src/**", "/migrations/**", "/Cargo.toml", "/README.md", "/LICENSE*"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
prometheus-parking-lot-core.workspace = true
chrono.workspace = true
sea-orm = { workspace = true, features = ["runtime-tokio-rustls", "sqlx-postgres", "macros"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls", "macros"] }
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true

[dev-dependencies]
testcontainers.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
