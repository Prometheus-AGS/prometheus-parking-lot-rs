[package]
name = "prometheus-parking-lot-pg"
description = "Postgres lease queue and result mailbox backends for prometheus_parking_lot."
documentation = "https://docs.rs/prometheus-parking-lot-pg"
keywords = ["scheduler", "queue", "postgres", "ai"]
categories = ["asynchronous", "database"]
readme = "README.md"
include = ["/src/**", "/migrations/**", "/Cargo.toml", "/README.md", "/LICENSE*"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
prometheus-parking-lot-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
prometheus-parking-lot-core = { workspace = true, features = ["conformance"] }
testcontainers.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
