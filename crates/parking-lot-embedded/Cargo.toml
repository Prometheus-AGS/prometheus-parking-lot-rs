[package]
name = "prometheus-parking-lot-embedded"
description = "Embedded file-backed queue and mailbox for prometheus_parking_lot (desktop and single-node)."
documentation = "https://docs.rs/prometheus-parking-lot-embedded"
keywords = ["scheduler", "queue", "embedded", "tauri", "ai"]
categories = ["asynchronous", "filesystem"]
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE*"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
prometheus-parking-lot-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
