[graph]
# Analyze only the default feature set unless you add --all-features to the deny command.
all-features = true

[advisories]
# Reject crates with known security advisories.
version = 2
ignore = []

[licenses]
# Only licenses present in the actual graph are allowed (cargo deny warns on unused
# entries). New backends (cr-22 iggy, cr-27 redb) add licenses here with a reason.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0", # webpki-roots (rustls trust anchors, via sqlx)
    "Zlib",
]

# MPL-2.0 is file-level copyleft: using the crates unmodified, as a dependency, puts no
# obligation on this code; modifying one of their files would oblige publishing that file.
# Allowed only for UniFFI (crates/parking-lot-ffi, cr-44), crate by crate, so a new MPL
# dependency elsewhere still fails the gate and gets its own review.
exceptions = [
    { allow = ["MPL-2.0"], crate = "uniffi" },
    { allow = ["MPL-2.0"], crate = "uniffi_core" },
    { allow = ["MPL-2.0"], crate = "uniffi_internal_macros" },
    { allow = ["MPL-2.0"], crate = "uniffi_macros" },
    { allow = ["MPL-2.0"], crate = "uniffi_meta" },
    { allow = ["MPL-2.0"], crate = "uniffi_pipeline" },
]

[bans]
# Disallow duplicate versions of the same crate (warn, not error, to avoid blocking first-time adds).
multiple-versions = "warn"
# Crates that must never appear in the dependency graph.
deny = []

[sources]
# Only allow crates from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
