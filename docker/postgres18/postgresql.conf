# parking-lot-pg: tuned postgresql.conf for queue workloads (PG 17 and 18).
# Shared by docker/postgres18 and docker/postgres17; every setting is valid on both.
# This is a TEST/LOCAL-DEV profile sized for a laptop or CI runner (about 1-2 GB
# for the container). Production sizing belongs to the operator.

# --- Connections ---------------------------------------------------------
# Listen on all interfaces; the official entrypoint relies on this when it
# runs the server with an explicit config_file.
listen_addresses = '*'
# N concurrent dispatchers plus the reaper and test harness each hold a
# connection; the acceptance test runs many dispatchers against one database.
max_connections = 200

# --- Memory --------------------------------------------------------------
# Hot queue working set is small; 256MB keeps pl_queue_jobs and its dequeue
# index cached without starving a CI runner.
shared_buffers = 256MB
# Planner hint only (no allocation): assume the OS caches the rest.
effective_cache_size = 768MB
# Small per-sort budget: queue statements are single-row claims, not sorts.
work_mem = 8MB
maintenance_work_mem = 64MB

# --- Durability (deliberately NOT relaxed) -------------------------------
# "Accepted work is never silently lost" is the product contract, so fsync and
# synchronous_commit stay at their safe defaults. Stated explicitly so nobody
# "optimizes" them in a copy of this file.
fsync = on
synchronous_commit = on
full_page_writes = on

# --- WAL / checkpoints ---------------------------------------------------
# Queue rows are updated several times (claim, heartbeat, ack): spread
# checkpoints out and compress full-page images to cut WAL volume.
wal_compression = on
checkpoint_timeout = 10min
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9

# --- Autovacuum (queue tables churn constantly) --------------------------
# Dead tuples from claim/ack cycles must be reclaimed quickly or the
# FOR UPDATE SKIP LOCKED scan walks dead index entries. Per-table overrides
# for pl_queue_jobs and pl_mailbox_messages live in the migrations (CR-36);
# these are the cluster-wide floor.
autovacuum = on
autovacuum_naptime = 10s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 2000

# --- Storage cost model --------------------------------------------------
# SSD/NVMe-backed container storage: prefer index scans for the dequeue index.
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Safety timeouts -----------------------------------------------------
# A dispatcher that dies holding a transaction must not pin row locks or the
# vacuum horizon; the lease reaper handles the logical side, this handles the
# physical side.
idle_in_transaction_session_timeout = 60s
tcp_keepalives_idle = 30
tcp_keepalives_interval = 10
tcp_keepalives_count = 3

# --- Observability -------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
track_io_timing = on
log_min_duration_statement = 500ms
log_lock_waits = on
deadlock_timeout = 1s
