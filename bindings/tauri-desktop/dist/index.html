<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parking Lot Queue Example</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Parking Lot Queue</h1>
      <p class="lede">Tasks are stored in a file the moment you submit them. Quit the app, start it again, and they are still waiting.</p>
    </header>

    <section aria-labelledby="submit-heading">
      <h2 id="submit-heading">Submit</h2>
      <form id="submit-form">
        <label for="text">Text to process</label>
        <textarea id="text" rows="3" required>summarise the quarterly report</textarea>
        <button type="submit">Add to queue</button>
      </form>
    </section>

    <section aria-labelledby="queue-heading">
      <h2 id="queue-heading">Queue</h2>
      <p id="status" role="status" aria-live="polite">Loading…</p>
      <div class="actions">
        <button type="button" id="process">Process next</button>
        <button type="button" id="collect">Collect results</button>
      </div>
    </section>

    <section aria-labelledby="results-heading">
      <h2 id="results-heading">Results</h2>
      <ul id="results" aria-live="polite"></ul>
      <p id="empty" class="muted">Nothing collected yet.</p>
    </section>

    <p id="error" role="alert" hidden></p>
  </main>
</body>
</html>
