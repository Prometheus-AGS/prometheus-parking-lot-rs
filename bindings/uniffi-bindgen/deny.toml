# cargo-deny policy for the binding generator's own dependency tree (a build-time tool,
# never linked into anything we ship). Same licence allowance as the root deny.toml,
# plus MPL-2.0 for UniFFI's generator crates. Run from the repository root:
#   cargo deny --manifest-path bindings/uniffi-bindgen/Cargo.toml --locked \
#     --config bindings/uniffi-bindgen/deny.toml check
[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # basic-toml is unmaintained (archived 2025-03); it is a dependency of
    # uniffi_bindgen, which we cannot change. The generator only reads our own build
    # output and never parses untrusted TOML. Review when uniffi is bumped.
    { id = "RUSTSEC-2026-0374", reason = "unmaintained, via uniffi_bindgen; build-time tool, no untrusted input" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    { allow = ["MPL-2.0"], crate = "uniffi" },
    { allow = ["MPL-2.0"], crate = "uniffi_bindgen" },
    { allow = ["MPL-2.0"], crate = "uniffi_core" },
    { allow = ["MPL-2.0"], crate = "uniffi_internal_macros" },
    { allow = ["MPL-2.0"], crate = "uniffi_macros" },
    { allow = ["MPL-2.0"], crate = "uniffi_meta" },
    { allow = ["MPL-2.0"], crate = "uniffi_pipeline" },
    { allow = ["MPL-2.0"], crate = "uniffi_udl" },
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
