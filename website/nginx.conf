# Docusaurus with trailingSlash: false emits /path.html for the route /path.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    absolute_redirect off;

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
