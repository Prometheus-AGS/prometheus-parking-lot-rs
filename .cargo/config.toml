[alias]
# `fmt` and `clippy` are external subcommands; aliasing them to themselves is a
# recursive alias, so the old entries made `cargo clippy` / `cargo fmt` error out
# without running. Canonical per-role loops (docs/build-performance.md): keep one
# feature set per worktree so artifacts are reused instead of rebuilt.
# The repository root is both the facade package and the workspace root, so every
# alias passes --workspace; `postgres` is a feature of the facade package.
ck = "check --workspace --all-targets --locked"
lint = "clippy --workspace --all-targets --locked -- -D warnings"
t = "nextest run --workspace --locked"
ck-pg = "check --workspace --all-targets --locked --features postgres"
lint-pg = "clippy --workspace --all-targets --locked --features postgres -- -D warnings"
t-pg = "nextest run --workspace --locked --features postgres"

# `cargo test --target wasm32-unknown-unknown` runs the wasm-bindgen-test suites
# (crates/parking-lot-wasm/tests) in Node.js through the runner from
# wasm-bindgen-cli, which must be the version of `wasm-bindgen` in Cargo.lock.
wasm = "test --locked --target wasm32-unknown-unknown -p prometheus-parking-lot-wasm"
wasm-ck = "check --locked --target wasm32-unknown-unknown -p prometheus-parking-lot-core -p prometheus-parking-lot-wasm --all-targets"

[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"

[build]
target-dir = "target"
